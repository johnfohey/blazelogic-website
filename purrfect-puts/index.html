<title>Purrfect Puts with Blaze</title>
<!--
  Purrfect Puts with Blaze — v2 (3D-style rebuild)
  Inspired by (not a copy of) Mini Golf 1000: Putt Putt Star — behind-the-ball
  perspective, pull-back-to-shoot with an aim cone, stars by putt count,
  redo tickets, pause, and a whole-hole overview toggle.
  Original game, art, and identity: BlazeLogic.
  Holes redesigned v2.1: every hole has its own layout and obstacles —
  ramps and raised plateaus (real elevation: the ball climbs, rolls back
  down, and launches off edges), a vertical rollercoaster loop the ball
  visibly travels through, a bridge over water, a kicker jump over a
  water gap, a spiral, a split path with a risky shortcut, a tunnel,
  moving and pinball bumpers, banked turns, and a downhill speed run.
  Holes hardened v2.2 (John: 1, 2, 3, 4, 8, 9 too easy): pinball guards on
  the straight lines of H1/H4/H8, loop moved left + gap wall on H2,
  bridge shifted east on H3, narrower plateau (90..310) + wider water +
  center pinball + gentler 24-high slope on H9 (36 stalled diagonal
  climbs and trapped the ball — verified by search). H5/H6/H7 untouched
  as the difficulty benchmark. H1 plateau narrowed to 140..260 to kill
  a banked ace; H8 tunnel mouth narrowed 165..235 to 185..215 (two
  guard pinballs tried first — the funnel walls deflect banked shots
  around them — so the mouth itself is the guard now).
  Preserved from v1: 9 holes in John's poster order, par 32 (3,3,4,3,4,4,4,3,4),
  hole 9 Blaze hazard (a sunk ball is never swatted out), scorecard,
  initials + Save score, Top Putters leaderboard on the separate
  'purrfect-puts' Supabase project.
  Stars: <= par = 3, par+1 = 2, par+2 = 1, par+3 = 0 (sunk), par+4 = fail.
  Redos: 3 per round. One file, no build step, no server beyond Supabase.
-->

/* ============ Course geometry (logical units: 400 x 640) — same as v1 ============ */

/* Elevation: PIT = no ground (water / gap — the ball splashes if it lands
   there). GRAV_Z pulls a jumping ball down; SLOPE_G is the pull of gravity
   along a slope (acceleration = -SLOPE_G * slope). */
const PIT = -1e9, GRAV_Z = 900, SLOPE_G = 800;
/* Stars: <= par = 3, par+1 = 2, par+2 = 1, par+3 = 0 (sunk), par+4 = fail.
   A failed hole records par+4 strokes so the round always ends. */
const REDOS_PER_ROUND = 3;

/* Walls are [x1,y1,x2,y2] segments.
   ramps: height zones {x1,y1,x2,y2,h0,h1,axis} — height goes from h0 at
     the y1 (or x1) edge to h1 at the y2 (or x2) edge. Flat plateaus are
     ramps with h0 == h1. groundH() takes the highest zone at a point.
   water: [x1,x2,y1,y2] — no ground; a ball that lands in it splashes and
     goes back to where the shot started. bridges: {x1,y1,x2,y2,h} — a
     deck over the water; the ball must stay on it.
   loop: a VERTICAL rollercoaster loop {x, y, r, minSpeed}. The ball enters
     at the bottom going north with speed >= minSpeed, travels up one side,
     over the top, and down the other side, and exits going north.
   pinballs: [[x,y]] — round bumpers that kick the ball away hard.
   movers: [{x,y,r,axis,min,max,speed,phase}] — bumpers sliding back and
     forth; they shove the ball with their own motion.
   arcs: [{x,y,r,a0,a1}] — curved walls, sampled into segments at load
     (a0..a1 in radians, 0 = east, clockwise on screen).
   spiral: {x,y,r0,r1,a0,turns} — a wall winding inward from r0 to r1
     starting at angle a0.
   circle: {x,y,r,gapA,gapB} — a ring wall with a gap (for the spiral bowl).
   tunnel: {x1,y1,x2,y2} — a tube the ball rolls under (visual + side walls).
   blaze: a medallion pacing horizontally; ball inside swatR gets swatted back. */

    water: [[40, 360, 250, 360]],

const TOTAL_PAR = HOLES.reduce((s, h) => s + h.par, 0); // 32

/* Sample curved walls (circles, spirals, arcs) into straight wall segments
   at load, so the plain segment collision already in the engine handles them. */
function sampleArc(h, cx, cy, r, a0, a1, steps) {
  for (let i = 0; i < steps; i++) {
    const aA = a0 + (a1 - a0) * i / steps, aB = a0 + (a1 - a0) * (i + 1) / steps;
    (h.walls = h.walls || []).push([
      cx + Math.cos(aA) * r, cy + Math.sin(aA) * r,
      cx + Math.cos(aB) * r, cy + Math.sin(aB) * r ]);
  }
}
function buildHoleGeometry() {
  HOLES.forEach(h => {
    if (h.circle) {
      const c = h.circle, steps = 40;
      for (let i = 0; i < steps; i++) {
        const aA = (i / steps) * Math.PI * 2, aB = ((i + 1) / steps) * Math.PI * 2;
        const mid = (aA + aB) / 2;
        if (inGap(mid, c.gapA, c.gapB)) continue; // leave the entry gap open
        (h.walls = h.walls || []).push([
          c.x + Math.cos(aA) * c.r, c.y + Math.sin(aA) * c.r,
          c.x + Math.cos(aB) * c.r, c.y + Math.sin(aB) * c.r ]);
      }
    }
    if (h.spiral) {
      const s = h.spiral, steps = 36, total = s.turns * Math.PI * 2;
      for (let i = 0; i < steps; i++) {
        const tA = i / steps, tB = (i + 1) / steps;
        const aA = s.a0 + total * tA, aB = s.a0 + total * tB;
        const rA = s.r0 + (s.r1 - s.r0) * tA, rB = s.r0 + (s.r1 - s.r0) * tB;
        (h.walls = h.walls || []).push([
          s.x + Math.cos(aA) * rA, s.y + Math.sin(aA) * rA,
          s.x + Math.cos(aB) * rB, s.y + Math.sin(aB) * rB ]);
      }
    }
    (h.arcs || []).forEach(a => sampleArc(h, a.x, a.y, a.r, a.a0, a.a1, 20));
  });
}
buildHoleGeometry();

/* ============ Images (byte-copied art, used exactly as supplied) ============ */

/* ============ Audio: synthesized WebAudio, mute toggle ============ */
let audioCtx = null, muted = false;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, dur, type, vol, slideTo) {
  if (muted || !audioCtx) return;
  const t = audioCtx.currentTime;

function burst(x, y, colors, n, speed) {

/* ============ Physics helpers (same engine as v1) ============ */
function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy || 1;
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t * dx, cy = y1 + t * dy;
  return { d: Math.hypot(px - cx, py - cy), cx, cy, nx: px - cx, ny: py - cy };
}
function collideSegment(x1, y1, x2, y2, extraVx, extraVy) {
  const r = distToSeg(ball.x, ball.y, x1, y1, x2, y2);
  if (r.d < BALL_R) {
    let nx, ny;
    if (r.d > 0.001) { nx = r.nx / r.d; ny = r.ny / r.d; }
    else {
      // The ball centre is exactly on the wall line, so there is no
      // push-out direction from the closest point. Use the segment's
      // perpendicular, pointing against the ball's travel, so a shot
      // fired straight down a wall still bounces off it.
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
      nx = -dy / len; ny = dx / len;
      if (ball.vx * nx + ball.vy * ny > 0) { nx = -nx; ny = -ny; }
    }
    ball.x = r.cx + nx * BALL_R; ball.y = r.cy + ny * BALL_R;
    const rvx = ball.vx - (extraVx || 0), rvy = ball.vy - (extraVy || 0);
    const dot = rvx * nx + rvy * ny;
    if (dot < 0) {
      ball.vx = rvx - 2 * dot * nx; ball.vy = rvy - 2 * dot * ny;
      ball.vx *= 0.72; ball.vy *= 0.72;
      ball.vx += (extraVx || 0); ball.vy += (extraVy || 0);
      sfx.bounce();
    }
  }
}
function collideCircle(cx, cy, cr, isBumper, ex, ey, power) {
  const dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy);
  const min = cr + BALL_R;
  if (d < min && d > 0.001) {
    const nx = dx / d, ny = dy / d;
    ball.x = cx + nx * min; ball.y = cy + ny * min;
    const rvx = ball.vx - (ex || 0), rvy = ball.vy - (ey || 0);
    const dot = rvx * nx + rvy * ny;
    if (dot < 0) {
      ball.vx = rvx - 2 * dot * nx; ball.vy = rvy - 2 * dot * ny;
      ball.vx *= 0.78; ball.vy *= 0.78;
      ball.vx += (ex || 0); ball.vy += (ey || 0);
      if (power) { // pinball bumper: kicks the ball away hard
        const sp = Math.hypot(ball.vx, ball.vy) || 1;
        const ns = Math.min(sp * power, 900);
        ball.vx = ball.vx / sp * ns; ball.vy = ball.vy / sp * ns;
        sfx.bumper(); burst(ball.x, ball.y, ["#ff6b6b", "#ffd166", "#ffffff"], 12, 200);
      } else if (isBumper) { sfx.bumper(); burst(ball.x, ball.y, ["#7ec8ff", "#ffffff"], 8, 140); }
      else sfx.bounce();
    }
  }
}
/* ============ Elevation: ground height and slope ============
   groundH returns the ground height at a point, or PIT where there is no
   ground (water / gap). Bridges are checked first so a deck over water
   counts as ground. slopeAt returns the height gradient {gx, gy}. */
function groundH(x, y) {
  const h = hole();
  const br = h.bridges || [];
  for (let i = 0; i < br.length; i++) {
    const b = br[i];
    if (x >= b.x1 && x <= b.x2 && y >= b.y1 && y <= b.y2) return b.h;
  }
  const w = h.water || [];
  for (let i = 0; i < w.length; i++) {
    if (x >= w[i][0] && x <= w[i][1] && y >= w[i][2] && y <= w[i][3]) return PIT;
  }
  let gh = 0;
  const rs = h.ramps || [];
  for (let i = 0; i < rs.length; i++) {
    const r = rs[i];
    if (x < r.x1 || x > r.x2 || y < r.y1 || y > r.y2) continue;
    let t;
    if (r.axis === "x") t = (x - r.x1) / ((r.x2 - r.x1) || 1);
    else t = (y - r.y1) / ((r.y2 - r.y1) || 1);
    t = Math.max(0, Math.min(1, t));
    gh = Math.max(gh, r.h0 + (r.h1 - r.h0) * t);
  }
  return gh;
}
function slopeAt(x, y) {
  const h = hole();
  let gx = 0, gy = 0;
  const rs = h.ramps || [];
  for (let i = 0; i < rs.length; i++) {
    const r = rs[i];
    if (x < r.x1 || x > r.x2 || y < r.y1 || y > r.y2) continue;
    if (r.axis === "x") gx += (r.h1 - r.h0) / ((r.x2 - r.x1) || 1);
    else gy += (r.h1 - r.h0) / ((r.y2 - r.y1) || 1);
  }

}
function splash() {

  ball.x = s.x; ball.y = s.y;
  ball.z = groundH(s.x, s.y); if (ball.z === PIT) ball.z = 0;
  ball.vz = 0; ball.grounded = true; ball.inLoop = null; ball.loopScale = 1;
  showBanner("SPLASH!", 1200); sfx.swat(); flash = 0.25;
  burst(ball.x, ball.y, ["#4cc9f0", "#ffffff"], 18, 220);
  updateHud();
}
function normAngle(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function inGap(a, gapA, gapB) { return normAngle(a - gapA) <= normAngle(gapB - gapA) + 0.001 && normAngle(a - gapA) >= 0; }

/* ============ Game flow ============ */
function snapCamera() {

    z: 0, vz: 0, grounded: true, inLoop: null, loopScale: 1, pz: 0, pinned: false };

function redoShot() {

  if (screen !== "play" || paused) return;
  ball.x = shotStart.x; ball.y = shotStart.y;
  ball.vx = 0; ball.vy = 0; ball.moving = false;
  ball.z = shotStart.z || 0; ball.vz = 0; ball.grounded = true;
  ball.inLoop = null; ball.loopScale = 1; ball.pinned = false;
  strokesThisHole = shotStart.strokes;
  shotStart = null;
  redosLeft--;

  sfx.click();

/* ============ Input: relative pull-back, drags never leave the game ============ */
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function aimVector() {
  const dx = aim.sx - aim.cx, dy = aim.sy - aim.cy; // pull measured from finger landing
  const len = Math.hypot(dx, dy);
  return { dx, dy, len, power: Math.min(len / MAX_DRAG, 1) };
}
function shoot() {
  const v = aimVector();
  if (v.len < 10 || v.power < MIN_POWER) return;
  shotStart = { x: ball.x, y: ball.y, z: ball.z, strokes: strokesThisHole };
  ball.vx = v.dx / v.len * v.power * MAX_SPEED;
  ball.vy = v.dy / v.len * v.power * MAX_SPEED;
  ball.moving = true; ball.pinned = false; strokesThisHole++;

  trail = [];
}
canvas.addEventListener("pointerdown", (e) => {
  ensureAudio();
  if (screen !== "play" || paused || holeOver) return;
  if (introLeft > 0) { introLeft = 0; return; } // tap skips the intro card
  if (ball.moving) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  const p = canvasPos(e);
  aim = { active: true, pointerId: e.pointerId, sx: p.x, sy: p.y, cx: p.x, cy: p.y };
});
canvas.addEventListener("pointermove", (e) => {
  if (!aim.active || e.pointerId !== aim.pointerId) return;
  const p = canvasPos(e);
  aim.cx = p.x; aim.cy = p.y;
});
function endAim(e, cancelled) {
  if (!aim.active || (e && e.pointerId !== aim.pointerId)) return;
  // A cancelled touch releases with the last drag — the putt never vanishes.
  if (aimVector().len >= 10) shoot();

}
canvas.addEventListener("pointerup", (e) => endAim(e, false));
canvas.addEventListener("pointercancel", (e) => endAim(e, true));
// Guards so a hard drag can never turn into a page swipe or scroll.
document.getElementById("app").addEventListener("touchmove", (e) => {

}, { passive: false });
document.addEventListener("touchmove", (e) => {

/* ============ Leaderboard (shared Supabase; no local fallback) ============ */
async function refreshBoard(elId) {
  const el = document.getElementById(elId);
  if (!SUPABASE_CONFIGURED) { el.textContent = "Leaderboard connecting — Supabase is not configured yet."; return; }
  if (!supabaseClient) { el.textContent = "Leaderboard unavailable (could not load Supabase client)."; return; }
  el.textContent = "Loading…";
  const { data, error } = await supabaseClient.from("purrfect_puts_scores")
    .select("initials, strokes, created_at").order("strokes", { ascending: true })
    .order("created_at", { ascending: true }).limit(10);
  if (error) { el.textContent = "Leaderboard unavailable: " + error.message; return; }
  if (!data || data.length === 0) { el.textContent = "No scores yet — be the first!"; return; }
  const ol = document.createElement("ol");
  data.forEach(r => {
    const li = document.createElement("li");
    li.textContent = r.initials + " — " + r.strokes + " strokes";
    ol.appendChild(li);
  });
  el.textContent = ""; el.appendChild(ol);
}

/* ============ 3D-style camera: perspective over the ground plane ============
   World coords stay 2D (same physics as v1). The camera looks north (-y)
   from behind the ball in follow mode, or high and far back in overview.
   proj() maps a world point at a given height above the ground to the screen.
   The ground itself is drawn as mode-7 strips of the hole's poster. */
function proj(wx, wy, hgt) {
  const d = (cam.cy - wy) + 40;
  if (d <= 6) return null;
  const s = cam.focal / d;

}
function groundEllipse(cx, cy, r, hgt) {
  const dy = cam.cy - cy;
  const s = cam.focal / (dy + 40);
  const dFar = Math.max(dy + r + 40, 6), dNear = Math.max(dy - r + 40, 6);
  const yFar = cam.horizon + (cam.camH - (hgt || 0)) * cam.focal / dFar;
  const yNear = cam.horizon + (cam.camH - (hgt || 0)) * cam.focal / dNear;
  return { x: W / 2 + (cx - cam.cx) * s, y: (yFar + yNear) / 2,

}

  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, cam.horizon + 1);
  ctx.fillStyle = "rgba(255,255,255,.8)";

    ctx.beginPath(); ctx.ellipse(c[0], c[1], c[2], c[2] * 0.42, 0, 0, Math.PI * 2); ctx.fill();
  });

  ctx.fillStyle = "#0d3b22"; ctx.fillRect(0, cam.horizon, W, H - cam.horizon);
  // The green itself is mowing stripes in world space. The hole posters are
  // title-card art, not grass — they show as the hole intro card instead

    const mid = (mv.min + mv.max) / 2, amp = (mv.max - mv.min) / 2;
    const ph = t * mv.speed + mv.phase;
    if (mv.axis === "x") {
      mv._x = mid + amp * Math.sin(ph); mv._y = mv.y;
      mv._vx = amp * mv.speed * Math.cos(ph); mv._vy = 0;
    } else {
      mv._x = mv.x; mv._y = mid + amp * Math.sin(ph);
      mv._vx = 0; mv._vy = amp * mv.speed * Math.cos(ph);
    }
  });
  if (swatCooldown > 0) swatCooldown -= dt;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.rect ? 60 * dt : 0; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (flash > 0) flash = Math.max(0, flash - dt);
  if (!ball.moving || holeOver) {
    // A ball at rest on a slope starts rolling back down — unless it was
    // pinned against a wall (the stuck detector set pinned), in which case
    // it stays put so the player can shoot.
    if (!ball.moving && !holeOver && ball.grounded && !ball.pinned) {
      const sl = slopeAt(ball.x, ball.y);
      const ax = -SLOPE_G * sl.gx, ay = -SLOPE_G * sl.gy;
      if (Math.hypot(ax, ay) > 60) {
        ball.moving = true; ball.vx = ax * 0.1; ball.vy = ay * 0.1;
      }
    }
    if (!ball.moving || holeOver) return;
  }


  // Substep the physics so a fast ball can't tunnel through a thin
  // wall: at full power it moves ~13px per frame, more than its radius,
  // so it could jump clean past a wall line in one step.
  const sub = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy) * dt / 5));
  const sdt = dt / sub;
  for (let _s = 0; _s < sub; _s++) {
    const prevZ = ball.z;
    const slBefore = ball.grounded ? slopeAt(ball.x, ball.y) : { gx: 0, gy: 0 };
    ball.x += ball.vx * sdt; ball.y += ball.vy * sdt;
    // Gravity along the slope (grounded only): it fights the climb and
    // speeds the ball down a downhill.
    if (ball.grounded) {
      ball.vx += -SLOPE_G * slBefore.gx * sdt;
      ball.vy += -SLOPE_G * slBefore.gy * sdt;
    }
    ball.vx *= Math.exp(-1.15 * sdt); ball.vy *= Math.exp(-1.15 * sdt);

    // Height: rolling on the ground follows it; rolling off an edge launches
    // the ball with the vertical speed it had on the slope (the kicker).
    if (ball.grounded) {
      const gh = groundH(ball.x, ball.y);
      if (gh === PIT) {
        ball.grounded = false;
        ball.vz = Math.max(0, slBefore.gx * ball.vx + slBefore.gy * ball.vy);
        ball.z = prevZ;
      } else {
        ball.z = gh;
      }
    }
    if (!ball.grounded) {
      ball.z += ball.vz * sdt; ball.vz -= GRAV_Z * sdt;
      const gh = groundH(ball.x, ball.y);
      if (gh === PIT) {
        if (ball.z <= 0) { splash(); return; }
      } else if (ball.z <= gh) {
        ball.z = gh; ball.vz = 0; ball.grounded = true;
      }
    }

    // Course bounds (slim frame inset)
    const m = 8;
    if (ball.x < m + BALL_R) { ball.x = m + BALL_R; ball.vx = Math.abs(ball.vx) * 0.72; sfx.bounce(); }
    if (ball.x > W - m - BALL_R) { ball.x = W - m - BALL_R; ball.vx = -Math.abs(ball.vx) * 0.72; sfx.bounce(); }
    if (ball.y < m + BALL_R) { ball.y = m + BALL_R; ball.vy = Math.abs(ball.vy) * 0.72; sfx.bounce(); }
    if (ball.y > H - m - BALL_R) { ball.y = H - m - BALL_R; ball.vy = -Math.abs(ball.vy) * 0.72; sfx.bounce(); }

    // Ground collisions only — a ball flying over a wall or bumper (a jump)
    // passes it cleanly.
    if (ball.grounded) {
      (h.walls || []).forEach(w => collideSegment(w[0], w[1], w[2], w[3]));
      (h.pinballs || []).forEach(p => collideCircle(p[0], p[1], 12, true, 0, 0, 1.5));
      (h.movers || []).forEach(mv => {
        if (mv._x !== undefined) collideCircle(mv._x, mv._y, mv.r, true, mv._vx, mv._vy, 0);
      });
      // Vertical loop entry: the ball must be lined up and moving north
      // fast enough. Too slow, and it bounces off the loop's base.
      if (h.loop) {
        const L = h.loop;
        const dx = ball.x - L.x, dy = ball.y - L.y;
        if (Math.abs(dx) < 24 && Math.abs(dy) < 24) {
          if (ball.vy < -L.minSpeed && Math.abs(ball.vx) < 260) {
            ball.inLoop = { L, theta: 0, speed: Math.hypot(ball.vx, ball.vy) };
            ball.vx = 0; ball.vy = 0;
          } else {
            collideCircle(L.x, L.y, 16, false);
          }
        }
      }
      // Blaze swats only a moving ball on the ground — a sunk ball is never
      // swatted out (sinking sets moving false first).
      if (h.blaze && swatCooldown <= 0) {
        const bd = Math.hypot(ball.x - h.blaze.x, ball.y - h.blaze.y);
        if (bd < h.blaze.swatR) {
          const nx = (ball.x - h.blaze.x) / (bd || 1), ny = (ball.y - h.blaze.y) / (bd || 1);
          ball.vx = nx * 520; ball.vy = ny * 520 - 60;
          swatCooldown = 0.6; sfx.swat(); flash = 0.25;
          burst(ball.x, ball.y, ["#ff9f1c", "#ffffff"], 16, 260);
        }
      }
      // Cup: sunk when the center reaches the cup (on the ground only).
      const cd = Math.hypot(ball.x - h.cup[0], ball.y - h.cup[1]);
      if (cd < CUP_R) {
        ball.moving = false; ball.x = h.cup[0]; ball.y = h.cup[1]; ball.z = groundH(h.cup[0], h.cup[1]);
        endHole(); return;
      }
    }
    trail.push({ x: ball.x, y: ball.y });
    if (trail.length > 14) trail.shift();
    const speed = Math.hypot(ball.vx, ball.vy);
    // Stuck detector: a ball pressed against a wall on a slope would never
    // count as stopped — if it hasn't moved in half a second, stop it.
    if (speed < 30) {
      if (Math.hypot(ball.x - restX, ball.y - restY) > 3) {
        restX = ball.x; restY = ball.y; restTimer = 0;
      } else {
        restTimer += sdt;
        if (restTimer > 0.5) {
          ball.moving = false; ball.vx = 0; ball.vy = 0; ball.pinned = true;
          updateHud();
          if (strokesThisHole >= h.par + 4) failHole();
          return;
        }
      }
    } else { restX = ball.x; restY = ball.y; restTimer = 0; }
    if (speed < 14) {
      // On a slope the ball keeps rolling back down instead of stopping.
      const sl = slopeAt(ball.x, ball.y);
      if (Math.hypot(-SLOPE_G * sl.gx, -SLOPE_G * sl.gy) <= 60) {
        ball.moving = false; ball.vx = 0; ball.vy = 0;
        updateHud(); // re-enable the redo button now the ball is at rest
        if (strokesThisHole >= h.par + 4) failHole();
      }
    }
  }
}

/* ============ Render ============ */
function drawContain(img) {
  const s = Math.min(W / img.width, H / img.height);
  const dw = img.width * s, dh = img.height * s;
  const dx = (W - dw) / 2, dy = (H - dh) / 2;
  ctx.drawImage(img, dx, dy, dw, dh);
  return { dx, dy, dw, dh };
}
function render(t) {
  ctx.clearRect(0, 0, W, H);
  if (screen === "title") {
    const img = IMAGES.title;
    ctx.fillStyle = "#0a241a"; ctx.fillRect(0, 0, W, H);
    if (img) drawContain(img);
    else { ctx.fillStyle = "#fff"; ctx.font = "900 30px system-ui"; ctx.textAlign = "center"; ctx.fillText("PURRFECT PUTTS", W / 2, H / 2 - 10); ctx.fillText("WITH BLAZE", W / 2, H / 2 + 30); }
  } else if (screen === "hub") {
    const img = IMAGES.hub;
    ctx.fillStyle = "#0a241a"; ctx.fillRect(0, 0, W, H);
    if (img) drawContain(img);
    else { ctx.fillStyle = "#fff"; ctx.font = "700 20px system-ui"; ctx.textAlign = "center"; ctx.fillText("Find BlazeLogic Everywhere", W / 2, H / 2); }
  } else if (screen === "play") {
    drawCourse(t);
    // Hole intro card: the hole's poster, full screen, for the first moment
    // of the hole (tap skips). The posters are the holes' identity; the
    // ground itself stays a readable green.
    if (introLeft > 0) {
      const img = IMAGES["hole" + (holeIndex + 1)];
      ctx.fillStyle = "rgba(6,18,12,.92)"; ctx.fillRect(0, 0, W, H);
      if (img) drawContain(img);
      ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, H - 140, W, 140);
      ctx.fillStyle = "#fff"; ctx.textAlign = "center";
      ctx.font = "900 24px system-ui";
      ctx.fillText("Hole " + (holeIndex + 1) + " · " + hole().name, W / 2, H - 104);
      ctx.font = "700 17px system-ui";
      ctx.fillText("Par " + hole().par + "   ·   Tap to play", W / 2, H - 74);
      ctx.font = "600 14px system-ui"; ctx.fillStyle = "#ffd166";
      ctx.fillText(hole().tip || "", W / 2, H - 42);
      ctx.textAlign = "left";
    }
  } else if (screen === "finish") {
    const img = IMAGES["hole9"];
    ctx.fillStyle = "#0a241a"; ctx.fillRect(0, 0, W, H);
    if (img) { drawContain(img); ctx.fillStyle = "rgba(8,20,12,.55)"; ctx.fillRect(0, 0, W, H); }
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
      if (p.rect) ctx.fillRect(p.x, p.y, p.size, p.size * 0.6);
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
    });
  }
  // Power bar follows the aim drag.
  const pw = document.getElementById("powerWrap");
  if (aim.active && screen === "play" && !ball.moving && !holeOver) {
    const v = aimVector();
    pw.classList.remove("hidden");
    const fill = document.getElementById("powerFill");
    fill.style.width = (v.power * 100) + "%";
    fill.style.background = v.power > 0.85 ? "#ef476f" : v.power > 0.55 ? "#ffd166" : "#06d6a0";
  } else {
    pw.classList.add("hidden");
  }
  if (screen === "finish") {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * 0.016; p.y += p.vy * 0.016; p.vy += p.rect ? 1 : 0; p.life -= 0.016;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }
}

/* ============ Main loop + boot ============ */
function loop(ts) {
  const t = ts / 1000;
  const dt = Math.min((ts - lastTime) / 1000 || 0, 0.05);
  lastTime = ts;
  if (screen === "play" && !paused) update(dt, t);
  render(t);
  requestAnimationFrame(loop);
}
setScreen("title");
refreshBoard("titleBoard");
requestAnimationFrame(loop);
</script>
</body>

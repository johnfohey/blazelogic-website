<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Purrfect Puts with Blaze</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a241a; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #app {
    position: relative; width: min(100vw, 480px); height: 100dvh;
    max-height: 900px; overflow: hidden; background: #0a241a;
    touch-action: none; overscroll-behavior: none;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; gap: 10px;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.28) 45%, rgba(0,0,0,0) 70%);
  }
  .screen.hidden { display: none; }
  .btn {
    appearance: none; border: 0; border-radius: 999px; cursor: pointer;
    padding: 14px 30px; font-size: 19px; font-weight: 800; letter-spacing: .3px;
    background: #ffb703; color: #1a1207; box-shadow: 0 4px 0 #c77f00, 0 8px 20px rgba(0,0,0,.45);
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c77f00; }
  .btn.secondary { background: rgba(255,255,255,.16); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  .btn.small { padding: 9px 18px; font-size: 15px; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .panel {
    width: 100%; max-width: 420px; background: rgba(10, 26, 19, .88);
    border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 12px 14px;
  }
  .panel h3 { margin: 0 0 6px; font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; color: #ffd166; }
  .panel ol, .panel ul { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.45; }
  .panel li { margin: 2px 0; }
  .panel .empty { font-size: 14px; opacity: .8; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; display: flex;
    justify-content: space-between; align-items: center; gap: 8px;
    padding: 10px 12px calc(10px + 0px);
    padding-top: calc(10px + env(safe-area-inset-top));
    font-weight: 700; font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,.8);
    pointer-events: none;
  }
  #hud.hidden { display: none; }
  #hud button { pointer-events: auto; }
  #muteBtn {
    appearance: none; border: 1px solid rgba(255,255,255,.4); background: rgba(0,0,0,.35);
    color: #fff; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #hint {
    position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom));
    text-align: center; font-size: 14px; font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,.9); pointer-events: none;
  }
  #hint.hidden { display: none; }
  #banner {
    position: absolute; left: 50%; top: 22%; transform: translateX(-50%) scale(.9);
    font-size: 44px; font-weight: 900; letter-spacing: 2px; color: #ffd166;
    text-shadow: 0 3px 0 #b35400, 0 6px 24px rgba(0,0,0,.6);
    opacity: 0; transition: opacity .18s ease, transform .18s ease; pointer-events: none; white-space: nowrap;
  }
  #banner.show { opacity: 1; transform: translateX(-50%) scale(1.05); }
  #finishCard { justify-content: flex-start; overflow-y: auto; }
  #finishCard h2 { margin: 6px 0 2px; font-size: 26px; }
  #finishCard .sub { opacity: .85; font-size: 14px; margin-bottom: 4px; }
  table.scorecard { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.scorecard th, table.scorecard td { padding: 4px 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.14); }
  table.scorecard td:first-child, table.scorecard th:first-child { text-align: left; }
  .initials { display: flex; gap: 8px; justify-content: center; }
  .initials input {
    width: 52px; height: 56px; font-size: 30px; font-weight: 900; text-align: center;
    text-transform: uppercase; border-radius: 12px; border: 2px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.12); color: #fff; outline: none;
  }
  .initials input:focus { border-color: #ffd166; }
  .note { font-size: 13px; opacity: .8; text-align: center; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app">
  <canvas id="game" width="400" height="640"></canvas>

  <div id="hud" class="hidden">
    <span id="hudHole">Hole 1 &middot; Par 3</span>
    <span id="hudScore">Strokes 0 &middot; Total 0</span>
    <button id="muteBtn" type="button">Sound: On</button>
  </div>
  <div id="hint" class="hidden">Pull back anywhere on the green, release to putt</div>
  <div id="banner"></div>

  <!-- Title screen: title card is drawn on the canvas behind this overlay -->
  <div id="titleScreen" class="screen">
    <div class="row"><button id="playBtn" class="btn" type="button">Play</button></div>
    <div class="panel">
      <h3>Top putters</h3>
      <div id="titleBoard" class="empty">Leaderboard connecting&hellip;</div>
    </div>
  </div>

  <!-- Hub intro: hub poster is drawn on the canvas behind this overlay -->
  <div id="hubScreen" class="screen hidden">
    <div class="row">
      <button id="teeOffBtn" class="btn" type="button">Tee off</button>
      <button id="hubBackBtn" class="btn secondary" type="button">Back</button>
    </div>
  </div>

  <!-- Finish screen: plain scorecard -->
  <div id="finishScreen" class="screen hidden">
    <div id="finishCard" class="panel">
      <h2>Round complete!</h2>
      <div class="sub" id="finishTotal"></div>
      <table class="scorecard" id="scoreTable"></table>
      <div style="height:10px"></div>
      <h3>Enter your initials</h3>
      <div class="initials">
        <input id="init1" maxlength="1" placeholder="A" autocomplete="off">
        <input id="init2" maxlength="1" placeholder="B" autocomplete="off">
        <input id="init3" maxlength="1" placeholder="C" autocomplete="off">
      </div>
      <div style="height:10px"></div>
      <div class="row">
        <button id="saveScoreBtn" class="btn small" type="button">Save score</button>
        <button id="playAgainBtn" class="btn small secondary" type="button">Play again</button>
      </div>
      <div style="height:8px"></div>
      <div id="saveNote" class="note"></div>
      <div style="height:10px"></div>
      <h3>Top putters</h3>
      <div id="finishBoard" class="empty">Leaderboard connecting&hellip;</div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============ Supabase config: fill these in at connection time ============ */
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const SUPABASE_CONFIGURED =
  SUPABASE_URL && !SUPABASE_URL.includes("YOUR_") &&
  SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes("YOUR_");
let supabaseClient = null;
if (SUPABASE_CONFIGURED && typeof window.supabase !== "undefined") {
  try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch (e) { supabaseClient = null; }
}

/* ============ Course geometry (logical units: 400 x 640) ============ */
const W = 400, H = 640;
const BALL_R = 8, CUP_R = 13, BUMPER_R = 14;
const MAX_STROKES = 10;
const MAX_DRAG = 150, MAX_SPEED = 950, MIN_POWER = 0.08;

/* Walls are [x1,y1,x2,y2] segments. Bumpers are [x,y] circles.
   Loop: ring with a gap (gapA..gapB in radians, 0 = east, clockwise on screen).
   Windmill: rotating arms around a hub. Gate: a bar sliding inside a wall gap.
   Blaze: a medallion pacing horizontally; ball inside swatR gets swatted back. */
const HOLES = [
  { name: "Purrfect Putts", par: 3, surface: "hole1.png",
    tee: [200, 580], cup: [200, 88],
    walls: [], bumpers: [[140, 380], [260, 300], [200, 215]] },
  { name: "Putting Challenge", par: 3, surface: "hole2.png",
    tee: [100, 580], cup: [300, 92],
    walls: [[200, 180, 200, 430]],
    bumpers: [[115, 300], [300, 410], [285, 215]] },
  { name: "Meet Blaze", par: 4, surface: "hole3.png",
    tee: [200, 580], cup: [200, 82],
    walls: [], bumpers: [[120, 425], [280, 425], [200, 285], [120, 185]] },
  { name: "Nassau", par: 3, surface: "hole4.png",
    tee: [200, 580], cup: [200, 88],
    walls: [], bumpers: [[108, 480], [292, 480], [200, 185]],
    windmill: { x: 200, y: 335, len: 72, speed: 0.9, angle: 0 } },
  { name: "Mini Golf", par: 4, surface: "hole5.png",
    tee: [200, 580], cup: [200, 88],
    walls: [], bumpers: [[108, 335], [292, 335], [140, 485], [260, 485]],
    loop: { x: 200, y: 330, r: 58, gapA: -Math.PI / 2 - 0.55, gapB: -Math.PI / 2 + 0.55 } },
  { name: "Stableford", par: 4, surface: "hole6.png",
    tee: [200, 580], cup: [200, 88],
    walls: [], bumpers: [[120, 425], [280, 425], [200, 160]],
    windmill: { x: 200, y: 300, len: 66, speed: 1.15, angle: 0.6 } },
  { name: "Bingo Bango Bongo", par: 4, surface: "hole7.png",
    tee: [200, 580], cup: [200, 82],
    walls: [[40, 480, 280, 480], [120, 360, 360, 360], [40, 240, 280, 240]],
    bumpers: [[322, 420], [78, 300], [322, 180]] },
  { name: "Hole-in-One", par: 3, surface: "hole8.png",
    tee: [200, 580], cup: [200, 88],
    walls: [[40, 330, 160, 330], [240, 330, 360, 330]],
    bumpers: [[110, 480], [290, 480], [200, 185]],
    gate: { y: 330, min: 150, max: 250, len: 60, speed: 1.1, phase: 0 } },
  { name: "The Final Hole", par: 4, surface: "hole9.png",
    tee: [200, 580], cup: [200, 70],
    walls: [], bumpers: [[108, 405], [292, 405], [108, 520], [292, 520]],
    loop: { x: 200, y: 405, r: 55, gapA: -Math.PI / 2 - 0.55, gapB: -Math.PI / 2 + 0.55 },
    windmill: { x: 200, y: 225, len: 62, speed: 1.35, angle: 0.3 },
    blaze: { y: 142, min: 90, max: 310, speed: 1.5, phase: 0, swatR: 54 } },
];
const TOTAL_PAR = HOLES.reduce((s, h) => s + h.par, 0); // 32

/* ============ Images (byte-copied art, used exactly as supplied) ============ */
const IMAGES = {};
function loadImage(key, src) {
  const img = new Image();
  img.onload = () => { IMAGES[key] = img; };
  img.onerror = () => { IMAGES[key] = null; };
  img.src = src;
}
loadImage("title", "assets/title.jpg");
loadImage("hub", "assets/hub.png");
loadImage("blaze", "assets/hole1.png");
HOLES.forEach((h, i) => loadImage("hole" + (i + 1), "assets/" + h.surface));

/* ============ Audio: synthesized WebAudio, mute toggle ============ */
let audioCtx = null, muted = false;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, dur, type, vol, slideTo) {
  if (muted || !audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || 0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  putt()  { tone(180, 0.12, "triangle", 0.25, 70); },
  bounce() { tone(320, 0.06, "square", 0.08); },
  bumper() { tone(520, 0.18, "sine", 0.2, 880); },
  sink()  { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.22, "sine", 0.2), i * 90)); },
  swat()  { tone(900, 0.22, "sawtooth", 0.2, 160); },
  click() { tone(700, 0.05, "square", 0.1); },
};

/* ============ Game state ============ */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width = W * dpr; canvas.height = H * dpr;
ctx.scale(dpr, dpr);

let screen = "title"; // title | hub | play | finish
let holeIndex = 0, strokesThisHole = 0, holeScores = [];
let ball = { x: 200, y: 580, vx: 0, vy: 0, moving: false };
let aim = { active: false, pointerId: null, sx: 0, sy: 0, cx: 0, cy: 0 };
let particles = [], trail = [], flash = 0, bannerTimer = null;
let lastTime = 0, swatCooldown = 0;
let holeOver = false;

function hole() { return HOLES[holeIndex]; }
function totalStrokes() { return holeScores.reduce((s, v) => s + v, 0); }
function show(id, on) { document.getElementById(id).classList.toggle("hidden", !on); }
function setScreen(s) {
  screen = s;
  show("titleScreen", s === "title");
  show("hubScreen", s === "hub");
  show("finishScreen", s === "finish");
  show("hud", s === "play");
  show("hint", s === "play");
}
function showBanner(text, ms) {
  const b = document.getElementById("banner");
  b.textContent = text; b.classList.add("show");
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.remove("show"), ms || 1300);
}
function updateHud() {
  const h = hole();
  document.getElementById("hudHole").textContent = "Hole " + (holeIndex + 1) + " · " + h.name + " · Par " + h.par;
  document.getElementById("hudScore").textContent = "Strokes " + strokesThisHole + " · Total " + (totalStrokes() + strokesThisHole);
}
function badgeFor(strokes, par) {
  if (strokes === 1) return "ACE!";
  if (strokes === par - 2) return "EAGLE!";
  if (strokes === par - 1) return "BIRDIE!";
  return null;
}
function burst(x, y, colors, n, speed) {
  for (let i = 0; i < (n || 18); i++) {
    const a = Math.random() * Math.PI * 2, v = (speed || 220) * (0.4 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: 0.6 + Math.random() * 0.5, max: 1.1,
      color: colors[(Math.random() * colors.length) | 0], size: 3 + Math.random() * 5 });
  }
}
function confetti() {
  const colors = ["#ffd166", "#ef476f", "#06d6a0", "#118ab2", "#ffffff"];
  for (let i = 0; i < 150; i++) {
    particles.push({ x: Math.random() * W, y: -10 - Math.random() * 120,
      vx: (Math.random() - 0.5) * 60, vy: 120 + Math.random() * 180,
      life: 2 + Math.random(), max: 3, rect: true,
      color: colors[(Math.random() * colors.length) | 0], size: 4 + Math.random() * 6 });
  }
}

/* ============ Physics helpers ============ */
function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy || 1;
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t * dx, cy = y1 + t * dy;
  return { d: Math.hypot(px - cx, py - cy), cx, cy, nx: px - cx, ny: py - cy };
}
function collideSegment(x1, y1, x2, y2, extraVx, extraVy) {
  const r = distToSeg(ball.x, ball.y, x1, y1, x2, y2);
  if (r.d < BALL_R && r.d > 0.001) {
    const nx = r.nx / r.d, ny = r.ny / r.d;
    ball.x = r.cx + nx * BALL_R; ball.y = r.cy + ny * BALL_R;
    const rvx = ball.vx - (extraVx || 0), rvy = ball.vy - (extraVy || 0);
    const dot = rvx * nx + rvy * ny;
    if (dot < 0) {
      ball.vx = rvx - 2 * dot * nx; ball.vy = rvy - 2 * dot * ny;
      ball.vx *= 0.72; ball.vy *= 0.72;
      ball.vx += (extraVx || 0); ball.vy += (extraVy || 0);
      sfx.bounce();
    }
  }
}
function collideCircle(cx, cy, cr, isBumper) {
  const dx = ball.x - cx, dy = ball.y - cy, d = Math.hypot(dx, dy);
  const min = cr + BALL_R;
  if (d < min && d > 0.001) {
    const nx = dx / d, ny = dy / d;
    ball.x = cx + nx * min; ball.y = cy + ny * min;
    const dot = ball.vx * nx + ball.vy * ny;
    if (dot < 0) {
      ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny;
      ball.vx *= 0.78; ball.vy *= 0.78;
      if (isBumper) { sfx.bumper(); burst(ball.x, ball.y, ["#7ec8ff", "#ffffff"], 8, 140); }
      else sfx.bounce();
    }
  }
}
function normAngle(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function inGap(a, gapA, gapB) { return normAngle(a - gapA) <= normAngle(gapB - gapA) + 0.001 && normAngle(a - gapA) >= 0; }

/* ============ Game flow ============ */
function startHole(i) {
  holeIndex = i; strokesThisHole = 0; holeOver = false;
  const h = hole();
  ball = { x: h.tee[0], y: h.tee[1], vx: 0, vy: 0, moving: false };
  trail = []; aim.active = false;
  setScreen("play"); updateHud();
}
function endHole() {
  if (holeOver) return;
  holeOver = true;
  holeScores.push(strokesThisHole);
  const h = hole();
  const badge = badgeFor(strokesThisHole, h.par);
  if (badge) { showBanner(badge); }
  sfx.sink();
  burst(h.cup[0], h.cup[1], ["#ffd166", "#ffffff", "#06d6a0"], 26, 240);
  flash = 0.35;
  setTimeout(() => {
    if (holeIndex >= HOLES.length - 1) finishRound();
    else startHole(holeIndex + 1);
  }, badge ? 1400 : 900);
}
function finishRound() {
  setScreen("finish");
  document.getElementById("finishTotal").textContent =
    "Total " + totalStrokes() + " · Par " + TOTAL_PAR + " · " +
    (totalStrokes() <= TOTAL_PAR ? "Under par — nice round!" : (totalStrokes() - TOTAL_PAR) + " over par");
  const tbl = document.getElementById("scoreTable");
  let html = "<tr><th>Hole</th>";
  for (let i = 0; i < 9; i++) html += "<th>" + (i + 1) + "</th>";
  html += "<th>Tot</th></tr><tr><td>Par</td>";
  HOLES.forEach(h => html += "<td>" + h.par + "</td>");
  html += "<td>" + TOTAL_PAR + "</td></tr><tr><td>Strokes</td>";
  holeScores.forEach(s => html += "<td>" + s + "</td>");
  html += "<td>" + totalStrokes() + "</td></tr>";
  tbl.innerHTML = html;
  confetti(); flash = 0.5;
  refreshBoard("finishBoard");
  document.getElementById("saveNote").textContent = SUPABASE_CONFIGURED
    ? "" : "Leaderboard connecting — Supabase is not configured yet, so scores can't be saved.";
  document.getElementById("saveScoreBtn").disabled = !SUPABASE_CONFIGURED;
}
function startRound() {
  holeScores = [];
  startHole(0);
}

/* ============ Input: relative pull-back, drags never leave the game ============ */
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function aimVector() {
  const dx = aim.sx - aim.cx, dy = aim.sy - aim.cy; // pull measured from finger landing
  const len = Math.hypot(dx, dy);
  return { dx, dy, len, power: Math.min(len / MAX_DRAG, 1) };
}
function shoot() {
  const v = aimVector();
  if (v.len < 10 || v.power < MIN_POWER) return;
  ball.vx = v.dx / v.len * v.power * MAX_SPEED;
  ball.vy = v.dy / v.len * v.power * MAX_SPEED;
  ball.moving = true; strokesThisHole++;
  sfx.putt(); updateHud();
  trail = [];
}
canvas.addEventListener("pointerdown", (e) => {
  ensureAudio();
  if (screen !== "play" || ball.moving || holeOver) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  const p = canvasPos(e);
  aim = { active: true, pointerId: e.pointerId, sx: p.x, sy: p.y, cx: p.x, cy: p.y };
});
canvas.addEventListener("pointermove", (e) => {
  if (!aim.active || e.pointerId !== aim.pointerId) return;
  const p = canvasPos(e);
  aim.cx = p.x; aim.cy = p.y;
});
function endAim(e, cancelled) {
  if (!aim.active || (e && e.pointerId !== aim.pointerId)) return;
  // A cancelled touch releases with the last drag — the putt never vanishes.
  if (aimVector().len >= 10) shoot();
  aim.active = false;
}
canvas.addEventListener("pointerup", (e) => endAim(e, false));
canvas.addEventListener("pointercancel", (e) => endAim(e, true));
// Guards so a hard drag can never turn into a page swipe or scroll.
document.getElementById("app").addEventListener("touchmove", (e) => {
  if (aim.active) e.preventDefault();
}, { passive: false });
document.addEventListener("touchmove", (e) => {
  if (screen === "play" && aim.active) e.preventDefault();
}, { passive: false });

/* ============ Buttons ============ */
document.getElementById("playBtn").addEventListener("click", () => { ensureAudio(); sfx.click(); setScreen("hub"); });
document.getElementById("hubBackBtn").addEventListener("click", () => { sfx.click(); setScreen("title"); });
document.getElementById("teeOffBtn").addEventListener("click", () => { sfx.click(); startRound(); });
document.getElementById("playAgainBtn").addEventListener("click", () => { sfx.click(); startRound(); });
document.getElementById("muteBtn").addEventListener("click", () => {
  ensureAudio(); muted = !muted;
  document.getElementById("muteBtn").textContent = muted ? "Sound: Off" : "Sound: On";
});
document.getElementById("saveScoreBtn").addEventListener("click", async () => {
  const initials = ["init1", "init2", "init3"].map(id => {
    const v = (document.getElementById(id).value || "").toUpperCase().replace(/[^A-Z]/g, "");
    return v || "·";
  }).join("");
  if (!supabaseClient) return;
  const note = document.getElementById("saveNote");
  note.textContent = "Saving…";
  const { error } = await supabaseClient.from("purrfect_puts_scores")
    .insert({ initials, strokes: totalStrokes() });
  if (error) { note.textContent = "Could not save: " + error.message; }
  else {
    note.textContent = "Saved! " + initials + " — " + totalStrokes() + " strokes.";
    document.getElementById("saveScoreBtn").disabled = true;
    refreshBoard("finishBoard");
  }
});

/* ============ Leaderboard (shared Supabase; no local fallback) ============ */
async function refreshBoard(elId) {
  const el = document.getElementById(elId);
  if (!SUPABASE_CONFIGURED) { el.textContent = "Leaderboard connecting — Supabase is not configured yet."; return; }
  if (!supabaseClient) { el.textContent = "Leaderboard unavailable (could not load Supabase client)."; return; }
  el.textContent = "Loading…";
  const { data, error } = await supabaseClient.from("purrfect_puts_scores")
    .select("initials, strokes, created_at").order("strokes", { ascending: true })
    .order("created_at", { ascending: true }).limit(10);
  if (error) { el.textContent = "Leaderboard unavailable: " + error.message; return; }
  if (!data || data.length === 0) { el.textContent = "No scores yet — be the first!"; return; }
  const ol = document.createElement("ol");
  data.forEach(r => {
    const li = document.createElement("li");
    li.textContent = r.initials + " — " + r.strokes + " strokes";
    ol.appendChild(li);
  });
  el.textContent = ""; el.appendChild(ol);
}

/* ============ Update ============ */
function update(dt, t) {
  const h = hole();
  if (h.windmill) h.windmill.angle += h.windmill.speed * dt;
  if (h.blaze) { h.blaze.x = (h.blaze.min + h.blaze.max) / 2 + (h.blaze.max - h.blaze.min) / 2 * Math.sin(t * h.blaze.speed + h.blaze.phase); }
  if (swatCooldown > 0) swatCooldown -= dt;
  // Particles and flash tick even when the ball is at rest (e.g. during a banner).
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.rect ? 60 * dt : 0; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (flash > 0) flash = Math.max(0, flash - dt);
  if (!ball.moving || holeOver) return;

  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  ball.vx *= Math.exp(-1.15 * dt); ball.vy *= Math.exp(-1.15 * dt);

  // Course bounds (slim frame inset)
  const m = 8;
  if (ball.x < m + BALL_R) { ball.x = m + BALL_R; ball.vx = Math.abs(ball.vx) * 0.72; sfx.bounce(); }
  if (ball.x > W - m - BALL_R) { ball.x = W - m - BALL_R; ball.vx = -Math.abs(ball.vx) * 0.72; sfx.bounce(); }
  if (ball.y < m + BALL_R) { ball.y = m + BALL_R; ball.vy = Math.abs(ball.vy) * 0.72; sfx.bounce(); }
  if (ball.y > H - m - BALL_R) { ball.y = H - m - BALL_R; ball.vy = -Math.abs(ball.vy) * 0.72; sfx.bounce(); }

  (h.walls || []).forEach(w => collideSegment(w[0], w[1], w[2], w[3]));
  (h.bumpers || []).forEach(b => collideCircle(b[0], b[1], BUMPER_R, true));

  if (h.loop) {
    const dx = ball.x - h.loop.x, dy = ball.y - h.loop.y, d = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    if (!inGap(ang, h.loop.gapA, h.loop.gapB) && Math.abs(d - h.loop.r) < BALL_R && d > 0.001) {
      const nx = dx / d, ny = dy / d;
      const dot = ball.vx * nx + ball.vy * ny;
      ball.x = h.loop.x + nx * (h.loop.r + (d < h.loop.r ? -BALL_R : BALL_R));
      ball.y = h.loop.y + ny * (h.loop.r + (d < h.loop.r ? -BALL_R : BALL_R));
      if ((d < h.loop.r && dot > 0) || (d > h.loop.r && dot < 0)) {
        ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny;
        ball.vx *= 0.72; ball.vy *= 0.72; sfx.bounce();
      }
    }
  }
  if (h.windmill) {
    const wm = h.windmill;
    for (let k = 0; k < 2; k++) {
      const a = wm.angle + k * Math.PI / 2;
      collideSegment(wm.x - Math.cos(a) * wm.len, wm.y - Math.sin(a) * wm.len,
                     wm.x + Math.cos(a) * wm.len, wm.y + Math.sin(a) * wm.len);
    }
  }
  if (h.gate) {
    const g = h.gate;
    const gx = (g.min + g.max) / 2 + (g.max - g.min) / 2 * Math.sin(t * g.speed + g.phase);
    collideSegment(gx, g.y, gx + g.len, g.y);
    g._x = gx;
  }
  if (h.blaze && swatCooldown <= 0) {
    const bd = Math.hypot(ball.x - h.blaze.x, ball.y - h.blaze.y);
    if (bd < h.blaze.swatR) {
      const nx = (ball.x - h.blaze.x) / (bd || 1), ny = (ball.y - h.blaze.y) / (bd || 1);
      ball.vx = nx * 520; ball.vy = ny * 520 - 60;
      swatCooldown = 0.6; sfx.swat(); flash = 0.25;
      burst(ball.x, ball.y, ["#ff9f1c", "#ffffff"], 16, 260);
    }
  }
  // Cup: sunk when the center reaches the cup.
  const cd = Math.hypot(ball.x - h.cup[0], ball.y - h.cup[1]);
  if (cd < CUP_R) {
    ball.moving = false; ball.x = h.cup[0]; ball.y = h.cup[1];
    endHole(); return;
  }
  trail.push({ x: ball.x, y: ball.y });
  if (trail.length > 14) trail.shift();
  const speed = Math.hypot(ball.vx, ball.vy);
  if (speed < 14) {
    ball.moving = false; ball.vx = 0; ball.vy = 0;
    if (strokesThisHole >= MAX_STROKES) {
      holeOver = true; holeScores.push(strokesThisHole);
      showBanner("Max strokes");
      setTimeout(() => {
        if (holeIndex >= HOLES.length - 1) finishRound();
        else startHole(holeIndex + 1);
      }, 1100);
    }
  }
}

/* ============ Render ============ */
function drawContain(img) {
  const s = Math.min(W / img.width, H / img.height);
  const dw = img.width * s, dh = img.height * s;
  const dx = (W - dw) / 2, dy = (H - dh) / 2;
  ctx.drawImage(img, dx, dy, dw, dh);
  return { dx, dy, dw, dh };
}
function drawSurface(img) {
  ctx.fillStyle = "#14532d"; ctx.fillRect(0, 0, W, H);
  if (img) {
    const r = drawContain(img);
    ctx.fillStyle = "rgba(8, 20, 12, 0.32)"; // readability wash
    ctx.fillRect(r.dx, r.dy, r.dw, r.dh);
  }
  ctx.strokeStyle = "rgba(245, 240, 225, 0.9)"; ctx.lineWidth = 3; // slim frame
  ctx.strokeRect(4, 4, W - 8, H - 8);
}
function drawYarnBall(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = "#3b82f6"; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = "#1d4ed8"; ctx.stroke();
  ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.3, r * 0.35, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.fill();
}
function drawCourse(t) {
  const h = hole();
  const img = IMAGES["hole" + (holeIndex + 1)];
  drawSurface(img || null);
  if (!img) { ctx.fillStyle = "#fff"; ctx.font = "700 20px system-ui"; ctx.textAlign = "center"; ctx.fillText(h.name, W / 2, H / 2); }
  // Tee spot: plain white ring
  ctx.beginPath(); ctx.arc(h.tee[0], h.tee[1], 14, 0, Math.PI * 2);
  ctx.lineWidth = 2.5; ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.stroke();
  // Walls
  ctx.lineCap = "round";
  (h.walls || []).forEach(w => {
    ctx.beginPath(); ctx.moveTo(w[0], w[1]); ctx.lineTo(w[2], w[3]);
    ctx.lineWidth = 10; ctx.strokeStyle = "#d9c49a"; ctx.stroke();
    ctx.lineWidth = 6; ctx.strokeStyle = "#b89b62"; ctx.stroke();
  });
  // Yarn loop
  if (h.loop) {
    const L = h.loop;
    ctx.beginPath(); ctx.arc(L.x, L.y, L.r, L.gapB, L.gapA + Math.PI * 2);
    ctx.lineWidth = 12; ctx.strokeStyle = "#f27059"; ctx.stroke();
    ctx.beginPath(); ctx.arc(L.x, L.y, L.r, L.gapB, L.gapA + Math.PI * 2);
    ctx.lineWidth = 6; ctx.strokeStyle = "#ff9d8a"; ctx.stroke();
    drawYarnBall(L.x + Math.cos(L.gapA) * L.r, L.y + Math.sin(L.gapA) * L.r, 10);
  }
  // Fish windmill: gold hub, two arms, simple gold fish blades
  if (h.windmill) {
    const wm = h.windmill;
    for (let k = 0; k < 2; k++) {
      const a = wm.angle + k * Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(wm.x - Math.cos(a) * wm.len, wm.y - Math.sin(a) * wm.len);
      ctx.lineTo(wm.x + Math.cos(a) * wm.len, wm.y + Math.sin(a) * wm.len);
      ctx.lineWidth = 7; ctx.strokeStyle = "#c9a227"; ctx.stroke();
      [1, -1].forEach(s => {
        const fx = wm.x + Math.cos(a) * wm.len * s, fy = wm.y + Math.sin(a) * wm.len * s;
        ctx.beginPath(); ctx.ellipse(fx, fy, 16, 9, a, 0, Math.PI * 2);
        ctx.fillStyle = "#f4b942"; ctx.fill();
        ctx.beginPath(); ctx.moveTo(fx - Math.cos(a) * 16 * s, fy - Math.sin(a) * 16 * s);
        ctx.lineTo(fx - Math.cos(a) * 26 * s - Math.sin(a) * 8, fy - Math.sin(a) * 26 * s + Math.cos(a) * 8);
        ctx.lineTo(fx - Math.cos(a) * 26 * s + Math.sin(a) * 8, fy - Math.sin(a) * 26 * s - Math.cos(a) * 8);
        ctx.closePath(); ctx.fillStyle = "#e09f1f"; ctx.fill();
      });
    }
    ctx.beginPath(); ctx.arc(wm.x, wm.y, 12, 0, Math.PI * 2);
    ctx.fillStyle = "#ffd166"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#8a6d00"; ctx.stroke();
  }
  // Sliding gate
  if (h.gate) {
    const gx = h.gate._x !== undefined ? h.gate._x : (h.gate.min + h.gate.max) / 2;
    ctx.beginPath(); ctx.moveTo(gx, h.gate.y); ctx.lineTo(gx + h.gate.len, h.gate.y);
    ctx.lineWidth = 10; ctx.strokeStyle = "#d9c49a"; ctx.stroke();
    ctx.lineWidth = 6; ctx.strokeStyle = "#b89b62"; ctx.stroke();
  }
  // Bumpers: blue yarn balls
  (h.bumpers || []).forEach(b => drawYarnBall(b[0], b[1], BUMPER_R));
  // Blaze hazard: title-card cat portrait in a gold medallion + dashed swat ring (John's supplied art)
  if (h.blaze) {
    ctx.beginPath(); ctx.arc(h.blaze.x, h.blaze.y, h.blaze.swatR, 0, Math.PI * 2);
    ctx.setLineDash([6, 8]); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,80,60,.85)"; ctx.stroke();
    ctx.setLineDash([]);
    const bi = IMAGES.blaze;
    if (bi) {
      ctx.save();
      ctx.beginPath(); ctx.arc(h.blaze.x, h.blaze.y, 20, 0, Math.PI * 2); ctx.clip();
      const s = Math.max(40 / bi.width, 40 / bi.height);
      ctx.drawImage(bi, h.blaze.x - bi.width * s / 2, h.blaze.y - bi.height * s / 2, bi.width * s, bi.height * s);
      ctx.restore();
      ctx.beginPath(); ctx.arc(h.blaze.x, h.blaze.y, 20, 0, Math.PI * 2);
      ctx.lineWidth = 3; ctx.strokeStyle = "#ffd166"; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(h.blaze.x, h.blaze.y, 20, 0, Math.PI * 2);
      ctx.fillStyle = "#ffd166"; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = "#8a6d00"; ctx.stroke();
      ctx.fillStyle = "#1a1207"; ctx.font = "900 11px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("BLAZE", h.blaze.x, h.blaze.y);
      ctx.textBaseline = "alphabetic";
    }
  }
  // Cup + flag
  ctx.beginPath(); ctx.arc(h.cup[0], h.cup[1], CUP_R, 0, Math.PI * 2);
  ctx.fillStyle = "#06130c"; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(h.cup[0], h.cup[1]); ctx.lineTo(h.cup[0], h.cup[1] - 34);
  ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(h.cup[0], h.cup[1] - 34); ctx.lineTo(h.cup[0] + 18, h.cup[1] - 28); ctx.lineTo(h.cup[0], h.cup[1] - 22);
  ctx.closePath(); ctx.fillStyle = "#ef476f"; ctx.fill();
  // Motion trail
  trail.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 3 + 5 * (i / trail.length), 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255," + (0.06 + 0.2 * (i / trail.length)) + ")"; ctx.fill();
  });
  // Ball
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
  ctx.fillStyle = "#ffffff"; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.stroke();
  // Aim arrow + power ring
  if (aim.active && screen === "play" && !ball.moving && !holeOver) {
    const v = aimVector();
    if (v.len >= 10) {
      const dirx = v.dx / v.len, diry = v.dy / v.len;
      const ax = ball.x + dirx * (26 + v.power * 70), ay = ball.y + diry * (26 + v.power * 70);
      ctx.beginPath(); ctx.moveTo(ball.x + dirx * 14, ball.y + diry * 14); ctx.lineTo(ax, ay);
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax, ay);
      ctx.lineTo(ax - dirx * 12 - diry * 7, ay - diry * 12 + dirx * 7);
      ctx.lineTo(ax - dirx * 12 + diry * 7, ay - diry * 12 - dirx * 7);
      ctx.closePath(); ctx.fillStyle = "rgba(255,255,255,.95)"; ctx.fill();
      ctx.beginPath(); ctx.arc(ball.x, ball.y, 20, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * v.power);
      ctx.lineWidth = 5; ctx.strokeStyle = v.power > 0.85 ? "#ef476f" : "#ffd166"; ctx.stroke();
    }
  }
  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    if (p.rect) ctx.fillRect(p.x, p.y, p.size, p.size * 0.6);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
    ctx.globalAlpha = 1;
  });
  if (flash > 0) { ctx.fillStyle = "rgba(255,255,255," + (flash * 0.8) + ")"; ctx.fillRect(0, 0, W, H); }
}
function render(t) {
  ctx.clearRect(0, 0, W, H);
  if (screen === "title") {
    const img = IMAGES.title;
    ctx.fillStyle = "#0a241a"; ctx.fillRect(0, 0, W, H);
    if (img) drawContain(img);
    else { ctx.fillStyle = "#fff"; ctx.font = "900 30px system-ui"; ctx.textAlign = "center"; ctx.fillText("PURRFECT PUTTS", W / 2, H / 2 - 10); ctx.fillText("WITH BLAZE", W / 2, H / 2 + 30); }
  } else if (screen === "hub") {
    const img = IMAGES.hub;
    ctx.fillStyle = "#0a241a"; ctx.fillRect(0, 0, W, H);
    if (img) drawContain(img);
    else { ctx.fillStyle = "#fff"; ctx.font = "700 20px system-ui"; ctx.textAlign = "center"; ctx.fillText("Find BlazeLogic Everywhere", W / 2, H / 2); }
  } else if (screen === "play") {
    drawCourse(t);
  } else if (screen === "finish") {
    const img = IMAGES["hole9"];
    ctx.fillStyle = "#0a241a"; ctx.fillRect(0, 0, W, H);
    if (img) { drawContain(img); ctx.fillStyle = "rgba(8,20,12,.55)"; ctx.fillRect(0, 0, W, H); }
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color;
      if (p.rect) ctx.fillRect(p.x, p.y, p.size, p.size * 0.6);
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
    });
  }
  // Keep particles ticking on the finish screen too
  if (screen === "finish") {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * 0.016; p.y += p.vy * 0.016; p.vy += p.rect ? 1 : 0; p.life -= 0.016;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }
}

/* ============ Main loop + boot ============ */
function loop(ts) {
  const t = ts / 1000;
  const dt = Math.min((ts - lastTime) / 1000 || 0, 0.05);
  lastTime = ts;
  if (screen === "play") update(dt, t);
  render(t);
  requestAnimationFrame(loop);
}
setScreen("title");
refreshBoard("titleBoard");
requestAnimationFrame(loop);
</script>
</body>
</html>
